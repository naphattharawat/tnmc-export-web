<div class="logs-container">
  <div class="logs-header">
    <div class="title-block">
      <h2>Logs</h2>
      <p>แสดงบรรทัดล่าสุดจากระบบ</p>
    </div>
    <button class="refresh-btn" type="button" (click)="load()" [disabled]="isLoading">
      รีเฟรช
    </button>
  </div>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <div class="logs-box" *ngIf="!isLoading; else loading">
    <div *ngIf="lines.length > 0; else empty" class="logs-content">
      <div *ngFor="let line of lines" class="log-line">{{ line }}</div>
    </div>
    <ng-template #empty>
      <div class="empty">ยังไม่มีรายการ</div>
    </ng-template>
  </div>

  <ng-template #loading>
    <div class="empty">กำลังโหลดข้อมูล...</div>
  </ng-template>
</div>
