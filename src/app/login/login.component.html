<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">เข้าสู่ระบบด้วย THAID</h2>
    <button class="thaid-btn" type="button" (click)="loginWithThaid()" [disabled]="isLoading">
      <img class="thaid-logo" src="assets/thaid.png" alt="THAID" />
      <span class="thaid-text">
        <span class="thaid-main">THAID</span>
        <span class="thaid-sub">คลิกเพื่อเข้าสู่ระบบ</span>
      </span>
    </button>
    <div class="thaid-hint">ระบบจะพาคุณไปยังหน้า THAID เพื่อยืนยันตัวตน</div>
  </div>
</div>
