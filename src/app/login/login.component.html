<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">เข้าสู่ระบบ</h2>
    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required
          #usernameInput="ngModel"
          class="form-control"
          placeholder="กรุณาป้อนชื่อผู้ใช้">
        <div class="error-message" *ngIf="usernameInput.invalid && usernameInput.touched">
          กรุณาป้อนชื่อผู้ใช้
        </div>
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          #passwordInput="ngModel"
          class="form-control"
          placeholder="กรุณาป้อนรหัสผ่าน">
        <div class="error-message" *ngIf="passwordInput.invalid && passwordInput.touched">
          กรุณาป้อนรหัสผ่าน
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        [class.loading]="isLoading"
        class="login-btn">
        <span *ngIf="!isLoading">เข้าสู่ระบบ</span>
        <span *ngIf="isLoading">กำลังเข้าสู่ระบบ...</span>
      </button>
    </form>
  </div>
</div>
